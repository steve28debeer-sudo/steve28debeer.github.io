<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fruit Fun Demo Lesson</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>🍎 Fruit Fun! 🍌</h1>
    <p>Kindergarten Demo Class – 15 Minutes</p>
  </header>

  <section class="lesson-box">
    <h2>Today we will learn 5 fruits!</h2>

    <div class="fruit-grid">
      <button onclick="showFruit('Apple', '🍎')">🍎 Apple</button>
      <button onclick="showFruit('Banana', '🍌')">🍌 Banana</button>
      <button onclick="showFruit('Orange', '🍊')">🍊 Orange</button>
      <button onclick="showFruit('Pear', '🍐')">🍐 Pear</button>
      <button onclick="showFruit('Kiwi', '🥝')">🥝 Kiwi</button>
    </div>

    <div id="display" class="display-box">
      <span class="big-fruit">🌈</span>
      <h2>Click a fruit!</h2>
    </div>
  </section>

  <section class="game-box">
    <h2>Teacher Says:</h2>
    <p>“Show me the apple!”</p>
    <p>“Touch the banana!”</p>
    <p>“What fruit is orange?”</p>
  </section>

  <footer>
    <p>Great job, everyone! ⭐</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
